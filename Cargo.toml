[workspace]
resolver = "3"
members = [
    "crates/tutti",
    "crates/tutti-core",
    "crates/tutti-server",
    "crates/tutti-agents",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
vt100 = "0.16"
anyhow = "1"
sysinfo = "0.39"
tutti-core = { path = "crates/tutti-core" }
tutti-server = { path = "crates/tutti-server" }
tutti-agents = { path = "crates/tutti-agents" }
