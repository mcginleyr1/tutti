[workspace]
resolver = "3"
members = [
    "crates/tutti",
    "crates/tutti-core",
    "crates/tutti-server",
    "crates/tutti-agents",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
rtty-vt = { git = "https://github.com/mcginleyr1/rtty", rev = "a9c826647cb5eca47adf36b9989a808b2e542dbd" }
memchr = "2.7"
anyhow = "1"
sysinfo = "0.39"
toml = "1"
terminal-colorsaurus = "1"
base64 = "0.22"
signal-hook = "0.3"
tutti-core = { path = "crates/tutti-core" }
tutti-server = { path = "crates/tutti-server" }
tutti-agents = { path = "crates/tutti-agents" }

# The terminal engine runs on every pty read, render tick and `pane read`,
# and on every frame the TUI is handed; optimized even in dev builds, a debug
# build and the read perf test see its real cost rather than its unoptimized
# iterator chains (a full 10k-row read: ~22 ms → ~2 ms).
[profile.dev.package.rtty-vt]
opt-level = 3
