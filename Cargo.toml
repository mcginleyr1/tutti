[workspace]
resolver = "3"
members = [
    "crates/tutti",
    "crates/tutti-core",
    "crates/tutti-server",
    "crates/tutti-agents",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
vt100 = "0.16"
anyhow = "1"
sysinfo = "0.39"
toml = "1"
terminal-colorsaurus = "1"
base64 = "0.22"
tutti-core = { path = "crates/tutti-core" }
tutti-server = { path = "crates/tutti-server" }
tutti-agents = { path = "crates/tutti-agents" }

# vt100 formats every render tick and every `pane read`; optimized even in dev
# builds, a debug daemon and the read perf test see its real cost rather than
# its unoptimized iterator chains (a full 10k-row read: ~30 ms → a few ms).
[profile.dev.package.vt100]
opt-level = 3
